<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Akatz Utils Hub{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <img src="{{ url_for('static', filename='img/akatz_logo_small.png') }}" alt="Logo" class="nav-logo">
            <span>Akatz Utils</span>
        </a>
        <div class="nav-links">
            <a href="/">Hub</a>
            <a href="/imgsizer">ImgSizer</a>
            <a href="/pdf2md">PDF2MD</a>
            <a href="/vid2gif">Vid2GIF</a>
            <a href="/ytclipper">YT Clipper</a>
            <a href="/frameclipper">Frame Clipper</a>
        </div>
    </nav>
    <main class="container">
        {% if config.SHARED_ROOT and request.path not in ['/', '/ytclipper'] %}
        <div class="panel" style="padding: 1rem; margin-bottom: 1rem">
            <label><input type="checkbox" id="sharedExportEnabled"> Save exports directly to shared drive</label>
            <input type="text" id="sharedExportFolder" value="Projects/Akatz-Utils/exports" aria-label="Shared-drive export folder" style="margin-top: 0.6rem; width: 100%">
            <p id="sharedExportStatus" role="status"></p>
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/shared-export.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
